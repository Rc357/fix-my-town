name: fixmytown_citizen
description: A production-oriented Flutter starter using Riverpod and go_router.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter:
    sdk: flutter
  flutter_compress: ^2.0.0
  flutter_local_notifications: ^22.3.0
  flutter_riverpod: ^3.3.2
  geolocator: ^13.0.2
  go_router: ^17.3.0
  google_fonts: ^8.2.1
  image_picker: ^1.1.2
  logger: ^2.7.0
  supabase_flutter: ^2.17.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/logo/
