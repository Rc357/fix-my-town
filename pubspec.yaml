name: fixmytown_citizen
description: A production-oriented Flutter starter using Riverpod and go_router.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  geolocator: ^13.0.2
  go_router: ^17.3.0
  image_picker: ^1.1.2
  logger: ^2.7.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
